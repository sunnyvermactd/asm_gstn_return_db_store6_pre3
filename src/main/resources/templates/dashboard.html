<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>GSTN Enterprise Monitoring Dashboard</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

	<!-- Header -->
	<div th:insert="fragments/header :: header"></div>

	<div class="container-fluid">

		<div class="row">

			<!-- Sidebar -->
			<div class="col-md-2 p-0">
				<div th:insert="fragments/sidebar :: sidebar"></div>
			</div>

			<!-- Main Content -->
			<div class="col-md-10 p-3">

				<!-- Dashboard -->
				<div id="dashboardSection">
					<div th:insert="fragments/dashboard-home :: dashboardHome"></div>
				</div>

				<!-- Report Generation -->
				<div id="reportSection" style="display:none;">
					<div th:insert="fragments/report-generation :: reportGeneration"></div>
				</div>

				<!-- Last Update -->
				<div id="lastUpdateSection" style="display:none;">
					<div th:insert="fragments/last-update :: lastUpdate"></div>
				</div>

				<!-- Mismatch Analysis -->
				<div id="mismatchSection" style="display:none;">
					<div th:insert="fragments/mismatch-analysis :: mismatchAnalysis"></div>
				</div>

				<!-- Statistics -->
				<div id="statisticsSection" style="display:none;">
					<div th:insert="fragments/statistics :: statistics"></div>
				</div>

				<!-- System Health -->
				<div id="healthSection" style="display:none;">
					<div th:insert="fragments/system-health :: systemHealth"></div>
				</div>

				<!-- Return On The Fly -->
				<div id="returnOnFlySection" style="display:none;">
					<div th:insert="fragments/return-on-fly :: returnOnFlySection"></div>
				</div>

				<div id="crnReportSection" style="display:none;">
					<div th:insert="fragments/crn-report :: crnReport"></div>
				</div>

				<div id="registrationReportSection" style="display:none;">
					<div th:insert="fragments/registration-report :: registrationReport"></div>
				</div>

				<div id="ledgerSection" style="display:none;">
					<div th:insert="fragments/ledger :: ledgerSection"></div>
				</div>

				<div id="EwayBillNewSection" style="display:none;">
					<div th:insert="fragments/eway-bill-new-section :: EwayBillNewSection"></div>
				</div>

				<div id="ewaySearchSection" style="display:none;">

					<div th:insert="fragments/eway-bill-search-section :: ewayBillSearchSection"></div>

				</div>

			</div>
		</div>
	</div>

	<!-- ON THE FLY Templates START-->
	<div style="display:none">

		<div id="gstr3bTemplate">
			<div th:replace="fragments/gstr3b-return :: gstr3bReturn"></div>
		</div>

	</div>

	<div style="display:none">

		<div id="gstr1Template">
			<div th:replace="fragments/gstr1-return :: gstr1Return"></div>
		</div>

	</div>

	<!-- ON THE FLY Templates START END-->

	<!-- JS Libraries -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

	<!-- Custom JS -->
	<script th:src="@{/js/dashboard.js}"></script>

	<script th:src="@{/js/return-on-fly.js}"></script>

	<script th:src="@{/js/eway-bill.js}"></script>
	
	<script th:src="@{/js/eway-bill-search.js}"></script>

</body>

</html>
