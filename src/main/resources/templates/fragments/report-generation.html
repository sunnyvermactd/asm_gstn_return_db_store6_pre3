<div th:fragment="reportGeneration">

    <div class="card mt-3">

        <div class="card-header">
            <h5 class="mb-0">
                Report Generation
            </h5>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-3">
                    <label class="form-label">
                        From Date
                    </label>

                    <input type="date"
                           id="fromDate"
                           class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">
                        To Date
                    </label>

                    <input type="date"
                           id="toDate"
                           class="form-control">
                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Return Type (TY)
                    </label>

                    <select id="ty"
                            class="form-select">

                        <option value="R1">RETURN-GSTR1</option>
                        <option value="R1A">RETURN-GSTR1A</option>
                        <option value="R2B">RETURN-GSTR2B</option>
                        <option value="R3B">RETURN-GSTR3B</option>
                        <option value="R4">RETURN-GSTR4</option>
                        <option value="R5">RETURN-GSTR5</option>
                        <option value="R6">RETURN-GSTR6</option>
                        <option value="R7">RETURN-GSTR7</option>
                        <option value="R8">RETURN-GSTR8</option>
                        <option value="R98A">RETURN-GSTR98A</option>
                        <option value="R9C">RETURN-GSTR9C</option>
                        <option value="R9A">RETURN-GSTR9A</option>
                        <option value="R9">RETURN-GSTR9</option>
                        <option value="R10">RETURN-GSTR10</option>
                        <option value="R11">RETURN-GSTR11</option>
                        <option value="payment">PAYMENT</option>
                        <option value="CM8">COMPOSITION-CMP-08</option>
                        <option value="PARTA">EWAY-BILL-PARTA</option>
                        <option value="PARTB">EWAY-BILL-PARTB</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        &nbsp;
                    </label>

                    <button id="generateBtn"
                            class="btn btn-success w-100">

                        Generate Report

                    </button>

                </div>

            </div>

            <hr>

            <div id="processingDiv"
                 class="alert alert-warning"
                 style="display:none">

                <span class="spinner-border spinner-border-sm"></span>
                Processing Report. Please Wait...

            </div>

            <div id="successDiv"
                 class="alert alert-success"
                 style="display:none">

                Report Generated Successfully

            </div>

            <div class="table-responsive">

                <table id="reportTable"
                       class="table table-bordered table-hover">

                    <thead>

                    <tr>

                        <th>DATE</th>

                        <th>NO. FILES</th>

                        <th>FILE NUM</th>

                        <th>NO. FILES CNT</th>

                        <th>JSON DATE</th>

                        <th>FILE NUMBER</th>

                        <th>JSON COUNT</th>

                        <th>STATUS</th>

                    </tr>

                    </thead>

                    <tbody></tbody>

                </table>

            </div>

            <div class="mt-3">

                <button class="btn btn-danger"
                        onclick="downloadPdf()">

                    Download PDF

                </button>

                <button class="btn btn-success"
                        onclick="downloadExcel()">

                    Download Excel

                </button>

            </div>

        </div>

    </div>

</div>
